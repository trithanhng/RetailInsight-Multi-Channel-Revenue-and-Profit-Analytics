name: Verify pipeline and dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Load pinned Microsoft data
        run: python -m src.pipeline.retail --download
      - name: Verify Spark SQL against pandas
        run: python -m src.benchmark.mart --repeats 1
      - name: Load additional original tables for Q1-Q8
        run: python -c "from src.ingestion.source import download; from src.benchmark.prepare import DIMENSIONS, FACTS; download(tables=[*DIMENSIONS, *FACTS])"
      - name: Verify the eight SQL workloads
        run: python -m src.benchmark.runner --repeats 1
      - name: Run tests
        run: python -m pytest -q
      - name: Build report and evidence
        run: |
          python -m src.utils.report
          python -m src.utils.delivery
