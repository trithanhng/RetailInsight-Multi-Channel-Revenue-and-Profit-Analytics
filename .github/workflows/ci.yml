name: Verify pipeline and dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Load pinned Microsoft data
        run: python -m retail_bi.pipeline --download
      - name: Verify Spark SQL against pandas
        run: python -m retail_bi.benchmark --repeats 1
      - name: Run tests
        run: python -m pytest -q
      - name: Build report and evidence
        run: |
          python -m retail_bi.report
          python -m retail_bi.delivery
